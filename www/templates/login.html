<ion-view view-title="SplitIt" hide-nav-bar="true">
  <ion-content class="padding">
    <h1 class="brand">SplitIt</h1>
    <p class="center muted">Split bills with friends, settle up in a tap.</p>
    <div class="list list-inset">
      <label class="item item-input" ng-if="vm.signup"><input type="text" placeholder="Name" ng-model="vm.form.name"></label>
      <label class="item item-input"><input type="email" placeholder="Email" ng-model="vm.form.email"></label>
      <label class="item item-input"><input type="password" placeholder="Password" ng-model="vm.form.password"></label>
    </div>
    <button class="button button-block button-balanced" ng-click="vm.submit()">{{vm.signup ? 'Create account' : 'Sign in'}}</button>
    <button class="button button-block button-clear button-dark" ng-click="vm.signup = !vm.signup">{{vm.signup ? 'I have an account' : 'Create an account'}}</button>
  </ion-content>
</ion-view>
